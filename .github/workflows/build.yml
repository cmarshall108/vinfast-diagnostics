name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The `secrets` context is not allowed in step-level `if:` conditions, so
    # surface a presence flag here for the macOS signing steps to test.
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            artifact: vinfast_scanner-linux-x86_64
            qt_version: "6.7.*"
          - name: macOS (universal)
            os: macos-latest
            artifact: vinfast_scanner-macos
            qt_version: "6.7.*"
            osx_archs: "arm64;x86_64"
          - name: Windows (x64)
            os: windows-latest
            artifact: vinfast_scanner-windows-x64
            qt_version: "6.7.*"
            vcpkg_triplet: x64-windows
            cmake_arch: x64
          # 32-bit (x86) build. Required so the executable can load Toyota's
          # Mini-VCI J2534 driver (mvci32.dll), which is a 32-bit DLL a 64-bit
          # process cannot load. Qt6 publishes NO prebuilt 32-bit binaries, so
          # Qt is built from source by vcpkg for this job (qt_via_vcpkg).
          - name: Windows (x86 / 32-bit)
            os: windows-latest
            artifact: vinfast_scanner-windows-x86
            vcpkg_triplet: x86-windows
            cmake_arch: Win32
            qt_via_vcpkg: true
          - name: Windows (ARM64)
            os: windows-11-arm
            artifact: vinfast_scanner-windows-arm64
            qt_version: "6.8.*"
            qt_arch: win64_msvc2022_arm64
            vcpkg_triplet: arm64-windows
            cmake_arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Qt6 (Widgets). Prebuilt binaries from install-qt-action for every
      # platform EXCEPT 32-bit Windows, for which Qt6 ships no official
      # binaries - that job builds Qt from source via vcpkg instead.
      # ----------------------------------------------------------------
      - name: Install Qt
        if: ${{ matrix.qt_via_vcpkg != true }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: ""
          cache: true

      # ----------------------------------------------------------------
      # libcurl: system package on Linux, system framework on macOS,
      # vcpkg on Windows.
      # ----------------------------------------------------------------
      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install libcurl (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install curl:${{ matrix.vcpkg_triplet }}
        shell: pwsh

      # 32-bit Windows only: Qt6 has no prebuilt x86 binaries, so build Qt
      # Widgets from source through vcpkg. This is slow (Qt is large) but is
      # the only reliable way to obtain a 32-bit Qt6. vcpkg's binary cache
      # keeps subsequent runs fast.
      - name: Install Qt via vcpkg (Windows x86)
        if: ${{ matrix.qt_via_vcpkg == true }}
        run: vcpkg install "qtbase[core,widgets,gui,png]:${{ matrix.vcpkg_triplet }}"
        shell: pwsh

      # ----------------------------------------------------------------
      # Configure & build.
      # ----------------------------------------------------------------
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_archs }}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel

      # ----------------------------------------------------------------
      # Bundle dependencies so the binary is runnable standalone.
      # ----------------------------------------------------------------
      - name: Deploy (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          # Stage a FHS-style AppDir for linuxdeploy.
          mkdir -p AppDir/usr/bin
          cp build/vinfast_scanner AppDir/usr/bin/
          # Minimal .desktop entry + icon required by linuxdeploy.
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          # linuxdeploy validates the icon against its hicolor directory, so the
          # source PNG (non-square / wrong size) must be normalised to 256x256.
          sudo apt-get install -y imagemagick
          convert assets/images/vinfast-vf8.png -resize 256x256 -background none \
            -gravity center -extent 256x256 \
            AppDir/usr/share/icons/hicolor/256x256/apps/vinfast_scanner.png
          cat > AppDir/usr/share/applications/vinfast_scanner.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=VinFast Scanner
          Exec=vinfast_scanner
          Icon=vinfast_scanner
          Categories=Utility;
          Terminal=false
          EOF
          # Fetch linuxdeploy + the Qt plugin into a tools dir so they don't
          # collide with the produced AppImage when globbing later.
          mkdir -p tools
          wget -q -O tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage tools/linuxdeploy-plugin-qt-x86_64.AppImage
          export PATH="$PWD/tools:$PATH"
          export QML_SOURCES_PATHS=""
          export OUTPUT="VinFast_Scanner-x86_64.AppImage"
          tools/linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/vinfast_scanner.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/vinfast_scanner.png
          mv "$OUTPUT" dist/VinFast_Scanner-x86_64.AppImage
        env:
          EXTRACT_AND_RUN: 1

      - name: Deploy (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          "$QT_ROOT_DIR/bin/macdeployqt" build/vinfast_scanner.app -always-overwrite

      # Ad-hoc sign when no Developer ID is configured. This does NOT satisfy
      # Gatekeeper for downloaded apps, but it gives the universal binary a
      # valid signature so it loads on Apple Silicon (which rejects unsigned
      # arm64 Mach-O images).
      - name: Ad-hoc sign (macOS, no certificate)
        if: ${{ runner.os == 'macOS' && env.HAS_MACOS_CERT != 'true' }}
        run: |
          codesign --force --deep --sign - build/vinfast_scanner.app
          codesign --verify --verbose=2 build/vinfast_scanner.app

      # Import the Developer ID certificate into a throwaway keychain.
      # All signing/notarization steps are skipped automatically when the
      # MACOS_CERTIFICATE secret is not configured, so forks still build.
      - name: Import signing certificate (macOS)
        if: ${{ runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign app (macOS)
        if: ${{ runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' }}
        env:
          MACOS_CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_CERT_IDENTITY" build/vinfast_scanner.app
          codesign --verify --strict --verbose=2 build/vinfast_scanner.app

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          hdiutil create -volname "VinFast Scanner" \
            -srcfolder build/vinfast_scanner.app \
            -ov -format UDZO dist/VinFast_Scanner.dmg

      - name: Notarize & staple (macOS)
        if: ${{ runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' }}
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/VinFast_Scanner.dmg \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple dist/VinFast_Scanner.dmg

      - name: Deploy (Windows, prebuilt Qt)
        if: ${{ runner.os == 'Windows' && matrix.qt_via_vcpkg != true }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/vinfast_scanner.exe dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations dist/vinfast_scanner.exe
          # Bring in the vcpkg curl runtime DLLs.
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg_triplet }}/bin/*.dll" dist/ -ErrorAction SilentlyContinue
        shell: pwsh

      # 32-bit Windows: Qt came from vcpkg, so use vcpkg's windeployqt and copy
      # the vcpkg runtime DLLs (Qt + curl) from the x86 install tree.
      - name: Deploy (Windows x86, vcpkg Qt)
        if: ${{ runner.os == 'Windows' && matrix.qt_via_vcpkg == true }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/vinfast_scanner.exe dist/
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg_triplet }}"
          & "$vcpkgRoot/tools/Qt6/bin/windeployqt.exe" --release --no-translations `
            --libdir dist --plugindir dist/plugins dist/vinfast_scanner.exe
          # Fallback: copy the vcpkg runtime DLLs (Qt6Widgets/Gui/Core, curl, etc.).
          Copy-Item "$vcpkgRoot/bin/*.dll" dist/ -ErrorAction SilentlyContinue
        shell: pwsh

      # ----------------------------------------------------------------
      # Upload build artifacts.
      # ----------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  # ------------------------------------------------------------------
  # On tag pushes, gather all artifacts and publish a GitHub Release.
  # ------------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../${name}.zip" "$d"
          done
          cd ..
          ls -la *.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
